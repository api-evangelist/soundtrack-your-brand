source: >-
  npm registry search, GitHub org github.com/soundtrackyourbrand, and the
  Soundtrack API + SDK documentation.
notes: >-
  Soundtrack does not publish an installable first-party GraphQL client SDK on
  any public registry (npm/PyPI/Maven/NuGet/RubyGems/etc.). The GraphQL API is
  consumed with any standard GraphQL/HTTP client. Two first-party developer
  resources exist: a public GraphQL example app (frontend demo, not a library)
  and the separate partner-gated Soundtrack Player SDK (a native C SDK for
  hardware/embedded playback partners, distributed under NDA — not a public
  package).
packages:
