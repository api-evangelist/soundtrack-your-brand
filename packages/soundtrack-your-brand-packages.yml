    registry: github
    name: soundtrack_api-example_app
    url: https://github.com/soundtrackyourbrand/soundtrack_api-example_app
    kind: example-app
    install: git clone; yarn
    official: true
    notes: Reference/demo app showing how to call the Soundtrack GraphQL API. Not a distributable SDK.
  - language: c
    registry: partner
    name: Soundtrack Player SDK (libsplayer)
    url: https://developer.soundtrackyourbrand.com/
    kind: native-sdk
    access: partner-nda
    official: true
    notes: >-
      Native C SDK + headers for embedding Soundtrack playback in partner
      hardware/software. Access requires a partnership request (sdk@soundtrack.io)
      and NDA; a shared library is built per partner toolchain. Not publicly installable.
