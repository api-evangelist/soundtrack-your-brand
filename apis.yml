aid: soundtrack-your-brand
name: Soundtrack Your Brand
description: >-
  Soundtrack Your Brand (Soundtrack) is a Stockholm-based business music streaming company that provides
  licensed background music for physical spaces such as retail stores, restaurants, cafes, hotels and
  gyms. Its Soundtrack API is a single-endpoint GraphQL API that lets partners and customers build
  display, control and monitoring applications on top of Soundtrack: read what is currently playing in a
  sound zone, control playback, pair playback devices, and manage schedules, playlists and music
  libraries across accounts and locations. The API is free for paying Soundtrack customers and is
  complemented by a partner-gated native Player SDK for embedding Soundtrack playback in hardware.
